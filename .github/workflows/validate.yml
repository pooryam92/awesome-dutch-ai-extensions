name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # format-nongpl is what makes the source_url and last_checked format checks
      # run at all; plain jsonschema treats "format" as an annotation and skips them.
      - run: pip install "jsonschema[format-nongpl]"

      - name: Validate data/
        run: python3 validate.py

  # Regenerates README.md and assets/badges after a merge, so PRs only need to
  # keep data/ valid. The bot's own commit re-triggers this and no-ops.
  build:
    if: github.event_name == 'push'
    needs: validate
    concurrency:
      group: regenerate-readme
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate README.md and assets/badges
        run: python3 build-readme.py

      - name: Commit the result if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898024+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/badges
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate README.md and badges from data/"
            git push
          fi
